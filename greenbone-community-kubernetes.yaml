apiVersion: v1
kind: Namespace
metadata:
  name: greenbone-community

# redis-server start
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-server
  namespace: greenbone-community
spec:
  selector:
    matchLabels:
      app: redis-server
  serviceName: redis-server
  replicas: 1
  template:
    metadata:
      labels:
        app: redis-server
    spec:
      initContainers:
        - name: redis-init
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              chown -R 101:1001 /tmp/redis
          volumeMounts:
            - name: redis-socket
              mountPath: /tmp/redis
      containers:
        - name: redis-server
          image: registry.community.greenbone.net/community/redis-server
          volumeMounts:
            - name: redis-socket
              mountPath: /run/redis
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "4"
          securityContext:
            runAsUser: 101
            runAsGroup: 101
      volumes:
        - name: redis-socket
          hostPath:
            path: /app/greenbone-community/redis/socket
            type: DirectoryOrCreate
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: redis-server
  namespace: greenbone-community
spec:
  selector:
    app: redis-server
  clusterIP: None

---
# redis-server end

# pg-gvm start
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-gvm
  namespace: greenbone-community

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pg-gvm
  namespace: greenbone-community
rules:
  - apiGroups:
    - "*"
    resources:
    - "*"
    verbs:
    - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pg-gvm
  namespace: greenbone-community
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pg-gvm
subjects:
  - kind: ServiceAccount
    name: pg-gvm

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-gvm
  namespace: greenbone-community
spec:
  selector:
    matchLabels:
      app: pg-gvm
  serviceName: pg-gvm
  replicas: 1
  template:
    metadata:
      labels:
        app: pg-gvm
    spec:
      serviceAccountName: pg-gvm
      initContainers:
        - name: pg-gvm-init
          image: registry.community.greenbone.net/community/pg-gvm:stable
          command:
            - /bin/sh
            - -c
            - |
              if [ "$(find /mnt/data -mindepth 1 | wc -l)" -eq 0 ]; then
                cp -rp /var/lib/postgresql/* /mnt/data/; 
                echo "copy data to /mnt/data..."
              else
                echo "copy data skipped"
              fi
              chmod 1777 /tmp1
          volumeMounts:
            - name: psql-data
              mountPath: /mnt/data
            - name: psql-cluster-socket
              mountPath: /tmp1
      containers:
        - name: pg-gvm
          image: registry.community.greenbone.net/community/pg-gvm:stable
          volumeMounts:
            - name: psql-data
              mountPath: /var/lib/postgresql
            - name: psql-socket
              mountPath: /var/run/postgresql
            - name: psql-cluster-socket
              mountPath: /tmp
          resources:
            requests:
              memory: "1Gi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "2"
      volumes:
        - name: psql-data
          hostPath:
            path: /app/greenbone-community/psql/data
            type: DirectoryOrCreate
        - name: psql-socket
          hostPath:
            path: /app/greenbone-community/psql/socket
            type: DirectoryOrCreate
        - name: psql-cluster-socket
          hostPath:
            path: /app/greenbone-community/psql/cluster-socket
            type: DirectoryOrCreate
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: pg-gvm
  namespace: greenbone-community
spec:
  selector:
    app: pg-gvm
  clusterIP: None

---
# pg-gvm end

# gvmd-init start
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gvmd-init
  namespace: greenbone-community
spec:
  completions: 1        # 需要成功完成的任务数（默认 1）
  parallelism: 1        # 并发执行的 Pod 数量（默认 1）
  backoffLimit: 3       # 最大重试次数（默认 6）
  template:
    spec:
      restartPolicy: OnFailure  # 仅任务失败时重启
      containers:
        - name: vulnerability-tests
          image: registry.community.greenbone.net/community/vulnerability-tests
          env:
            - name: FEED_RELEASE
              value: "24.10"
          volumeMounts:
            - name: vt-data
              mountPath: /mnt
        - name: scap-data
          image: registry.community.greenbone.net/community/scap-data
          volumeMounts:
            - name: scap-data
              mountPath: /mnt
        - name: cert-bund-data
          image: registry.community.greenbone.net/community/cert-bund-data
          volumeMounts:
            - name: cert-data
              mountPath: /mnt
        - name: dfn-cert-data
          image: registry.community.greenbone.net/community/dfn-cert-data
          volumeMounts:
            - name: cert-data
              mountPath: /mnt
        - name: data-objects
          image: registry.community.greenbone.net/community/data-objects
          env:
            - name: FEED_RELEASE
              value: "24.10"
          volumeMounts:
            - name: data-objects
              mountPath: /mnt
        - name: report-formats
          image: registry.community.greenbone.net/community/report-formats
          env:
            - name: FEED_RELEASE
              value: "24.10"
          volumeMounts:
            - name: data-objects
              mountPath: /mnt
        - name: notus-data
          image: registry.community.greenbone.net/community/notus-data
          volumeMounts:
            - name: notus-data
              mountPath: /mnt
        - name: gpg-data
          image: registry.community.greenbone.net/community/gpg-data
          volumeMounts:
            - name: gpg-data
              mountPath: /mnt
      volumes:
        - name: scap-data
          hostPath:
            path: /app/greenbone-community/gvmd/scap-data
            type: DirectoryOrCreate
        - name: cert-data
          hostPath:
            path: /app/greenbone-community/gvmd/cert-data
            type: DirectoryOrCreate
        - name: data-objects
          hostPath:
            path: /app/greenbone-community/gvmd/data-objects
            type: DirectoryOrCreate
        - name: vt-data
          hostPath:
            path: /app/greenbone-community/openvas/plugins
            type: DirectoryOrCreate
        - name: gpg-data
          hostPath:
            path: /app/greenbone-community/gpg/data
            type: DirectoryOrCreate
        - name: notus-data
          hostPath:
            path: /app/greenbone-community/notus/data
            type: DirectoryOrCreate
---
# gvmd-init end

# gvmd start
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gvmd
  namespace: greenbone-community
spec:
  selector:
    matchLabels:
      app: gvmd
  # serviceName: gvmd
  replicas: 1
  template:
    metadata:
      labels:
        app: gvmd
    spec:
      initContainers:
        - name: gvmd-data-init
          image: registry.community.greenbone.net/community/gvmd:stable
          command:
            - /bin/sh
            - -c
            - |
              if [ "$(find /mnt/data -mindepth 1 | wc -l)" -eq 0 ]; then
                cp -rp /var/lib/gvm/* /mnt/data/; 
                echo "copy data to /mnt/data..."
              else
                echo "copy data skipped"
              fi
              chown -R 1001:1001 /mnt/data
              chown -R 1001:1001 /mnt/gvmd-socket
          volumeMounts:
            - name: gvmd-data
              mountPath: /mnt/data
            - name: gvmd-socket
              mountPath: /mnt/gvmd-socket
      containers:
        - name: gvmd
          image: registry.community.greenbone.net/community/gvmd:stable
          volumeMounts:
            - name: gvmd-data
              mountPath: /var/lib/gvm
            - name: scap-data
              mountPath: /var/lib/gvm/scap-data/
            - name: cert-data
              mountPath: /var/lib/gvm/cert-data
            - name: data-objects
              mountPath: /var/lib/gvm/data-objects/gvmd
            - name: vt-data
              mountPath: /var/lib/openvas/plugins
            - name: psql-data
              mountPath: /var/lib/postgresql
            - name: gvmd-socket
              mountPath: /run/gvmd
            - name: ospd-openvas-socket
              mountPath: /run/ospd
            - name: psql-socket
              mountPath: /var/run/postgresql
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "4"
          # securityContext:
          #   runAsUser: 1001
          #   runAsGroup: 1001
      volumes:
        - name: gvmd-data
          hostPath:
            path: /app/greenbone-community/gvmd/data
            type: DirectoryOrCreate
        - name: scap-data
          hostPath:
            path: /app/greenbone-community/gvmd/scap-data
            type: Directory
        - name: cert-data
          hostPath:
            path: /app/greenbone-community/gvmd/cert-data
            type: Directory
        - name: data-objects
          hostPath:
            path: /app/greenbone-community/gvmd/data-objects
            type: Directory
        - name: vt-data
          hostPath:
            path: /app/greenbone-community/openvas/plugins
            type: Directory
        - name: psql-data
          hostPath:
            path: /app/greenbone-community/psql/data
            type: Directory
        - name: gvmd-socket
          hostPath:
            path: /app/greenbone-community/gvmd/socket
            type: DirectoryOrCreate
        - name: ospd-openvas-socket
          hostPath:
            path: /app/greenbone-community/ospd-openvas/socket
            type: Directory
        - name: psql-socket
          hostPath:
            path: /app/greenbone-community/psql/socket
            type: Directory
      restartPolicy: Always

