# gsa start
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gsa
  namespace: greenbone-community
spec:
  selector:
    matchLabels:
      app: gsa
  template:
    metadata:
      labels:
        app: gsa
    spec:
      containers:
        - name: gsa
          image: registry.community.greenbone.net/community/gsa:stable
          ports:
            - containerPort: 9392
          volumeMounts:
            - name: gvmd-socket
              mountPath: /run/gvmd
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "4"
      volumes:
        - name: gvmd-socket
          hostPath:
            path: /app/greenbone-community/gvmd/socket
            type: Directory
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: gsa
  namespace: greenbone-community
spec:
  selector:
    app: gsa
  type: NodePort
  ports:
    - protocol: TCP
      port: 9392
      targetPort: 9392
      nodePort: 30001

---
# gsa end

# openvasd start
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openvasd
  namespace: greenbone-community
spec:
  selector:
    matchLabels:
      app: openvasd
  serviceName: openvasd
  replicas: 1
  template:
    metadata:
      labels:
        app: openvasd
    spec:
      restartPolicy: Always
      initContainers:
        - name: configure-openvas
          image: registry.community.greenbone.net/community/openvas-scanner:stable
          command:
            - /bin/sh
            - -c
            - |
              printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
              sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
              chmod 644 /mnt/openvas.conf
              chmod 644 /mnt/openvas_log.conf
              touch /var/log/openvas/openvas.log
              chmod 666 /var/log/openvas/openvas.log
          volumeMounts:
            - name: openvas-data
              mountPath: /mnt
            - name: openvas-log-data
              mountPath: /var/log/openvas
      containers:
        - name: openvasd
          image: registry.community.greenbone.net/community/openvas-scanner:stable
          volumeMounts:
            - name: openvas-data
              mountPath: /etc/openvas
            - name: openvas-log-data
              mountPath: /var/log/openvas
            - name: gpg-data
              mountPath: /etc/openvas/gnupg
            - name: notus-data
              mountPath: /var/lib/notus
          env:
          - name: OPENVASD_MODE
            value: service_notus
          - name: GNUPGHOME
            value: /etc/openvas/gnupg
          - name: LISTENING
            value: 0.0.0.0:80
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "4"
        - name: openvas-logs
          image: registry.community.greenbone.net/community/openvas-scanner:stable
          command:
            - /bin/sh
            - -c
            - |
              cat /etc/openvas/openvas.conf
              tail -f /var/log/openvas/openvas.log
          volumeMounts:
            - name: openvas-data
              mountPath: /etc/openvas
            - name: openvas-log-data
              mountPath: /var/log/openvas
      volumes:
        - name: openvas-data
          hostPath:
            path: /app/greenbone-community/openvasd/data
            type: DirectoryOrCreate
        - name: openvas-log-data
          hostPath:
            path: /app/greenbone-community/openvas/log
            type: DirectoryOrCreate
        - name: gpg-data
          hostPath:
            path: /app/greenbone-community/gpg/data
            type: Directory
        - name: notus-data
          hostPath:
            path: /app/greenbone-community/notus/data
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: openvasd
  namespace: greenbone-community
spec:
  selector:
    app: openvasd
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
# openvasd end

# ospd-openvas start
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ospd-openvas
  namespace: greenbone-community
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ospd-openvas
  template:
    metadata:
      labels:
        app: ospd-openvas
    spec:
      containers:
        - name: ospd-openvas
          image: registry.community.greenbone.net/community/ospd-openvas:stable
          securityContext:
            privileged: true 
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          command:
            [
              "ospd-openvas",
              "-f",
              "--config",
              "/etc/gvm/ospd-openvas.conf",
              "--notus-feed-dir",
              "/var/lib/notus/advisories",
              "-m",
              "666",
            ]
          volumeMounts:
            - name: gpg-data
              mountPath: /etc/openvas/gnupg
            - name: vt-data
              mountPath: /var/lib/openvas/plugins
            - name: notus-data
              mountPath: /var/lib/notus
            - name: ospd-openvas-socket
              mountPath: /run/ospd
            - name: redis-socket
              mountPath: /run/redis/
            - name: openvas-data
              mountPath: /etc/openvas/
            - name: openvas-log-data
              mountPath: /var/log/openvas
      volumes:
        - name: gpg-data
          hostPath:
            path: /app/greenbone-community/gpg/data
            type: Directory
        - name: vt-data
          hostPath:
            path: /app/greenbone-community/openvas/plugins
            type: Directory
        - name: notus-data
          hostPath:
            path: /app/greenbone-community/notus/data
            type: Directory
        - name: ospd-openvas-socket
          hostPath:
            path: /app/greenbone-community/ospd-openvas/socket
            type: DirectoryOrCreate
        - name: redis-socket
          hostPath:
            path: /app/greenbone-community/redis/socket
            type: Directory
        - name: openvas-data
          hostPath:
            path: /app/greenbone-community/openvas/data
            type: DirectoryOrCreate
        - name: openvas-log-data
          hostPath:
            path: /app/greenbone-community/openvas/log
            type: Directory
      restartPolicy: Always

---
# ospd-openvas end

# gvm-tools start
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gvm-tools
  namespace: greenbone-community
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: gvm-tools
          image: registry.community.greenbone.net/community/gvm-tools
          volumeMounts:
            - name: gvmd-socket
              mountPath: /run/gvmd
            - name: ospd-openvas-socket
              mountPath: /run/ospd
      volumes:
        - name: gvmd-socket
          hostPath:
            path: /app/greenbone-community/gvmd/socket
            type: Directory
        - name: ospd-openvas-socket
          hostPath:
            path: /app/greenbone-community/ospd-openvas/socket
            type: Directory
      restartPolicy: OnFailure